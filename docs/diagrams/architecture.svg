<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 880" width="1120" height="880" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="1120" height="880" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#111">knok 架构（M2）</text>
  <text x="24" y="56" font-size="12" fill="#555">依赖方向只允许向下 / 向接口：internal/core 的 import 里永不出现 cilium/ebpf、vishvananda/netlink（CI 用 go list 断言）</text>
  <text x="24" y="74" font-size="11" fill="#999">源文件：docs/diagrams/architecture.drawio（draw.io / VS Code 插件可编辑）；报文级流程见 docs/diagrams/knock-flow.puml</text>

  <!-- ============ 左列：四层 ============ -->
  <rect x="24" y="90" width="676" height="128" rx="8" fill="#f7f8fa" stroke="#c9ced6"/>
  <text x="36" y="110" font-size="13" font-weight="700" fill="#333">Layer 3 · cmd（组装根）</text>
  <rect x="40" y="122" width="306" height="76" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="52" y="142" font-size="12" font-weight="600" fill="#123">cmd/knok — 客户端 CLI</text>
  <text x="52" y="160" font-size="10.5" fill="#234">跨平台纯 Go · knok keygen / auth --exec</text>
  <text x="52" y="178" font-size="10.5" fill="#234">只发一个 UDP 包，不等响应</text>
  <rect x="366" y="122" width="318" height="76" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="378" y="142" font-size="12" font-weight="600" fill="#123">cmd/knokd — 守护进程（Linux）</text>
  <text x="378" y="160" font-size="10.5" fill="#234">启动顺序不变量 [1]→[6]，防火墙最后装</text>
  <text x="378" y="178" font-size="10.5" fill="#234">-config / -uninstall / -metrics</text>

  <rect x="24" y="230" width="676" height="128" rx="8" fill="#f7f8fa" stroke="#c9ced6"/>
  <text x="36" y="250" font-size="13" font-weight="700" fill="#333">Layer 2 · internal/platform（平台适配器，仅 Linux 构建）</text>
  <rect x="40" y="262" width="306" height="76" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text x="52" y="282" font-size="12" font-weight="600" fill="#123">internal/platform/ebpf</text>
  <text x="52" y="300" font-size="10.5" fill="#234">AttachBackend：TCX（≥6.6）⇄ clsact 兜底</text>
  <text x="52" y="318" font-size="10.5" fill="#234">RingbufSource · MapAllowlist · maps 加载与 pin</text>
  <rect x="366" y="262" width="318" height="76" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text x="378" y="282" font-size="12" font-weight="600" fill="#123">internal/platform/nftables</text>
  <text x="378" y="300" font-size="10.5" fill="#234">inet knok 表：声明式整表替换（幂等）</text>
  <text x="378" y="318" font-size="10.5" fill="#234">无 mark → drop（终局）；mark → accept</text>

  <rect x="24" y="370" width="676" height="128" rx="8" fill="#f7f8fa" stroke="#c9ced6"/>
  <text x="36" y="390" font-size="13" font-weight="700" fill="#333">Layer 1 · internal/core（业务核心，纯 Go，macOS 上可完整单测）</text>
  <rect x="40" y="402" width="306" height="76" rx="8" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="52" y="422" font-size="12" font-weight="600" fill="#123">internal/core/ports — 六边形端口</text>
  <text x="52" y="440" font-size="10.5" fill="#234">PacketSource / Allowlist / Firewall</text>
  <text x="52" y="458" font-size="10.5" fill="#234">Clock / AuditSink（core 只认识接口）</text>
  <rect x="366" y="402" width="318" height="76" rx="8" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="378" y="422" font-size="12" font-weight="600" fill="#123">internal/core/auth — 验证管线</text>
  <text x="378" y="440" font-size="10.5" fill="#234">AEAD → 时间窗 → 防重放 → 策略 → TTL 封顶</text>
  <text x="378" y="458" font-size="10.5" fill="#234">Authenticator 主循环 + 结构化审计事件</text>

  <rect x="24" y="510" width="676" height="112" rx="8" fill="#f7f8fa" stroke="#c9ced6"/>
  <text x="36" y="530" font-size="13" font-weight="700" fill="#333">Layer 0 · pkg/protocol（对外公开，零 OS 依赖）</text>
  <rect x="40" y="544" width="644" height="62" rx="8" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="52" y="564" font-size="11.5" font-weight="600" fill="#123">线格式：magic "KNOK" | version | flags | AEAD nonce | 密文 + tag</text>
  <text x="52" y="581" font-size="10.5" fill="#234">XChaCha20-Poly1305（M2 为 PSK 模式；Ed25519/X25519 在 M3）</text>
  <text x="52" y="598" font-size="10.5" fill="#234">测试向量固化，供第三方实现对照</text>

  <!-- ============ 右列：内核 ============ -->
  <rect x="736" y="90" width="360" height="532" rx="8" fill="#fdf4f4" stroke="#e0b4b4"/>
  <text x="748" y="110" font-size="13" font-weight="700" fill="#7a2a2a">Linux 内核</text>

  <rect x="752" y="122" width="328" height="132" rx="8" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="764" y="142" font-size="11.5" font-weight="600" fill="#123">TC/TCX ingress 程序（bpf/knok_ingress.c）</text>
  <text x="764" y="161" font-size="10.5" fill="#234">1. allowlist 命中且未过期 → skb-&gt;mark =</text>
  <text x="772" y="176" font-size="10.5" fill="#234">0x4b4e4f4b</text>
  <text x="764" y="194" font-size="10.5" fill="#234">2. magic + 长度区间过滤垃圾包（扫描者无感）</text>
  <text x="764" y="212" font-size="10.5" fill="#234">3. UDP SPA 候选包 → ringbuf（零拷贝上送）</text>
  <text x="764" y="230" font-size="10.5" fill="#234">4. 过期条目惰性删除（TTL 精度到包）</text>
  <text x="764" y="248" font-size="10.5" font-weight="600" fill="#7a2a2a">只打标，永不主动丢弃业务流量</text>

  <rect x="752" y="268" width="328" height="122" rx="8" fill="#fff2cc" stroke="#d6b656"/>
  <text x="764" y="288" font-size="11.5" font-weight="600" fill="#123">pinned BPF maps（/sys/fs/bpf/knok）</text>
  <text x="764" y="307" font-size="10.5" fill="#234">allowlist：{srcIP, port} → expiry_ns</text>
  <text x="764" y="325" font-size="10.5" fill="#234">cfg：spa_port / min_len / max_len</text>
  <text x="764" y="343" font-size="10.5" fill="#234">spa_events：ringbuf 512KB · stats：计数器</text>
  <text x="764" y="365" font-size="10.5" font-weight="600" fill="#7a2a2a">pin 复用 → knokd 重启不丢已授权状态</text>

  <rect x="752" y="404" width="328" height="122" rx="8" fill="#f8cecc" stroke="#b85450"/>
  <text x="764" y="424" font-size="11.5" font-weight="600" fill="#123">nftables：inet knok（knokd 独占）</text>
  <text x="764" y="443" font-size="10.5" fill="#234">hook input，priority -200，policy accept</text>
  <text x="764" y="461" font-size="10.5" fill="#234">meta mark 0x4b4e4f4b accept</text>
  <text x="764" y="479" font-size="10.5" fill="#234">tcp / udp dport { 受保护 } drop</text>
  <text x="764" y="497" font-size="10.5" fill="#234">udp dport SPA 端口 drop（保持静默）</text>
  <text x="764" y="515" font-size="10.5" fill="#234">knokd 退出时保留该表（fail-closed）</text>

  <rect x="752" y="540" width="328" height="60" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="764" y="560" font-size="11.5" font-weight="600" fill="#123">受保护服务（如 sshd :22）</text>
  <text x="764" y="578" font-size="10.5" fill="#234">敲门前不可扫描；敲门后仅授权源 IP 可达</text>
  <text x="764" y="593" font-size="10.5" fill="#234">TTL 到期自动关闭</text>

  <!-- 逃生通道 -->
  <rect x="24" y="636" width="1072" height="34" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text x="38" y="658" font-size="11.5" fill="#123">safety.admin_allow — 逃生通道：永久放行（在防火墙之前写入），调试/卸载都不会把自己锁在门外</text>

  <!-- 数据流说明（替代连线） -->
  <text x="24" y="696" font-size="13" font-weight="700" fill="#333">数据流（编号对应上方方框；报文级时序见 knock-flow 时序图）</text>
  <g font-size="11" fill="#444">
    <text x="24" y="720">① 敲门：客户端 → spa_udp_port（UDP）→ TC/TCX ingress 候选匹配；非候选包在此静默丢弃。</text>
    <text x="24" y="742">② 上送：候选包经 ringbuf 交给 knokd（internal/platform/ebpf 的 RingbufSource）。</text>
    <text x="24" y="764">③ 验证：internal/core/auth 依次做 AEAD、时间窗、防重放、策略、TTL 封顶；全程不回复客户端。</text>
    <text x="24" y="786">④ 授权：通过后写 allowlist map（{srcIP, port} → expiry_ns）并落 spa_grant 审计；map 是 pinned 的，重启不丢。</text>
    <text x="24" y="808">⑤ 放行：业务包到达时查 allowlist 命中 → skb-&gt;mark；nftables 见到 mark → accept（继续走用户防火墙链）。</text>
    <text x="24" y="830">⑥ 到期：数据路径内联判断过期并惰性删除条目 → 不再打 mark → 端口重新隐身（无定时任务、无需删规则）。</text>
  </g>
  <text x="24" y="858" font-size="11" fill="#888">M2 临时性：PSK 模式 AEAD、单 goroutine 验证、无速率限制、interfaces 仅 explicit；M3 起换 Ed25519/X25519 与持久化重放缓存。</text>
</svg>